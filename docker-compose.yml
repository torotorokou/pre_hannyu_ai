services:
  ai-api:
    build: .
    container_name: ai-api
    volumes:
      - ./works/notebooks:/works/notebooks
      - ./works/data:/works/data
      - ./works/scripts:/works/scripts
      - ./vendor:/works/vendor:ro
      - ./requirements.txt:/works/requirements.txt:ro
    environment:
      - PYTHONPATH=/works:/works/vendor/app:/works/vendor/logic:/works/vendor/utils:/works/vendor/config
    user: "1000:1000"