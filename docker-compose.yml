services:
  # Jupyter開発環境用
  ai-jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./move:/works
    environment:
      - PYTHONPATH=/works
      - MODE=jupyter
    profiles:
      - jupyter

  # API本番環境用
  ai-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ai-api
    ports:
      - "8000:8000"
    volumes:
      - ./move:/works
    environment:
      - PYTHONPATH=/works
    profiles:
      - api