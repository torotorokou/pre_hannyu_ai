services:
  predict-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: predict-api
    environment:
      - MODEL_BUNDLE_PATH=/works/models/model_bundle.joblib
      - API_PORT=8080
      - API_RELOAD=true  # 開発時のみ true（本番は false 推奨）
    volumes:
      - ./vendor:/works/vendor:ro
      - ./scripts:/works/scripts:ro
      - ./models:/works/models
      - ./data:/works/data:ro
      - ./api:/works/api
    ports:
      - "8080:8080"
    restart: unless-stopped
